name: recreate-ghcr-public

# Delete the container package (created while the repo was private) so the next
# publish recreates it against the now-public repo (anonymous pull, like MCP).
# One-shot. Packages REST API cannot PATCH visibility.
on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete private package so the next push recreates it public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="subtitleedit-converter-api"
          echo "Attempting delete of container package ${name}"
          # Try authenticated-user and users/OWNER forms; package names are case-insensitive for lookup.
          if gh api --method DELETE "/user/packages/container/${name}"; then
            echo "Deleted via /user/packages"
          elif gh api --method DELETE "/users/${{ github.repository_owner }}/packages/container/${name}"; then
            echo "Deleted via /users/.../packages"
          else
            echo "::error::Could not delete package via API. Flip visibility in the UI: https://github.com/users/Wauter/packages/container/${name}/settings"
            exit 1
          fi
