name: package-visibility

# GitHub's Packages REST API has no working visibility-change endpoint for user container
# packages (PATCH returns 404). Set public once in the UI:
#   https://github.com/users/Wauter/packages/container/subtitleedit-converter-api/settings
# Danger Zone → Change visibility → Public.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Manual UI step required
        run: |
          echo "::notice::Open https://github.com/users/Wauter/packages/container/subtitleedit-converter-api/settings"
          echo "::notice::Danger Zone → Change visibility → Public (type the package name to confirm)."
          echo "Unauthenticated pull check: docker pull ghcr.io/wauter/subtitleedit-converter-api:1.3.0"
