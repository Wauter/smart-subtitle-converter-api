name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only: a main or tag run may be mid-push to GHCR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Every API change that ships bumps <Version> (CONTRIBUTING.md). PRs that touch src/ must raise it
  # above the merge base. Escape hatch: the `skip-version-check` label; Renovate PRs are exempt
  # (dependency bumps get folded into the next versioned change).
  version-check:
    if: github.event_name == 'pull_request' && github.actor != 'renovate[bot]' && !contains(github.event.pull_request.labels.*.name, 'skip-version-check')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: src/ changes bump the csproj <Version>
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          csproj=src/SmartSubtitleConverterApi/SmartSubtitleConverterApi.csproj
          base=$(git merge-base "$BASE_SHA" HEAD)
          if git diff --quiet "$base" HEAD -- src/; then echo "no src/ changes"; exit 0; fi
          ver() { sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' | head -1; }
          old=$(git show "$base:$csproj" | ver); new=$(ver < "$csproj")
          echo "base $old -> head $new"
          if [ "$old" = "$new" ] || [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" != "$new" ]; then
            echo "::error file=$csproj::src/ changed but <Version> did not go up ($old -> $new). Bump it (minor: additive, patch: fix) and add a CHANGELOG.md entry, or label the PR skip-version-check."
            exit 1
          fi

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: docker-compose.yml is valid
        run: docker compose config -q
      - name: Restore
        run: dotnet restore
      - name: Build (warnings as errors)
        run: dotnet build --no-restore -c Release -warnaserror
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Build isolated MinIO test server from pinned public source
        run: |
          mkdir -p "$RUNNER_TEMP/minio-test"
          GOBIN="$RUNNER_TEMP/minio-test" GOMAXPROCS=2 GOFLAGS=-p=2 go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
          echo "MINIO_BIN=$RUNNER_TEMP/minio-test/minio" >> "$GITHUB_ENV"
      - name: Test (including MinIO hybrids)
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then echo "::error::vulnerable packages found"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  docker-smoke:
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Size budgets (MiB): measured size of the shipped image + ~15% (design §13, PR #1).
        # amd64 measured 68.2 compressed / 158.2 uncompressed; arm64 64.4 / 165.2.
        include:
          - platform: linux/amd64
            max_compressed_mb: 78
            max_uncompressed_mb: 182
          - platform: linux/arm64
            max_compressed_mb: 74
            max_uncompressed_mb: 190
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
        if: matrix.platform == 'linux/arm64'
      - uses: docker/setup-buildx-action@v3
      - id: arch
        run: echo "arch=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: smart-subtitle-converter-api:smoke
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Smoke test (boot, readyz incl. globalization, convert, auth, file storage, size budget)
        run: scripts/smoke.sh smart-subtitle-converter-api:smoke ${{ matrix.platform }} ${{ matrix.max_uncompressed_mb }}
      - name: Postman collection (newman) against the container
        run: |
          docker run -d --name se-newman --platform ${{ matrix.platform }} -p 18081:8080 --read-only --tmpfs /tmp --cap-drop ALL \
            -e API_KEYS=newman-key smart-subtitle-converter-api:smoke
          for _ in $(seq 1 120); do curl -sf localhost:18081/readyz >/dev/null && break; sleep 1; done
          npx -y newman@6 run postman/smart-subtitle-converter-api.postman_collection.json \
            -e postman/smart-subtitle-converter-api.postman_environment.json \
            --env-var baseUrl=http://localhost:18081 --env-var apiKey=newman-key --working-dir . \
            --reporters cli,junit --reporter-junit-export newman/results.xml --color off \
            || { docker logs se-newman | tail -40; exit 1; }
          docker rm -f se-newman
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-${{ steps.arch.outputs.arch }}
          path: newman/
          if-no-files-found: ignore
      # Exact sizes, current image and the previous chiseled-extra base, from OCI exports (cache hits).
      - name: Export OCI (slim, current)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=oci,dest=/tmp/slim.oci.tar
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
      - name: Export OCI (chiseled-extra, previous base, for comparison)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=oci,dest=/tmp/extra.oci.tar
          build-args: |
            RUNTIME_BASE=base-extra
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
      - name: Image sizes (job summary + artifact; budget on the current image)
        run: |
          {
            echo "### Image size, ${{ matrix.platform }}"
            echo
            echo "| variant | platform | compressed (pull) | uncompressed (disk) | layers |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p sizes
          scripts/image-size.py /tmp/extra.oci.tar chiseled-extra ${{ matrix.platform }} > sizes/extra.json
          scripts/image-size.py /tmp/slim.oci.tar chiseled+icu-slim ${{ matrix.platform }} \
            --max-compressed-mb ${{ matrix.max_compressed_mb }} --max-uncompressed-mb ${{ matrix.max_uncompressed_mb }} > sizes/slim.json
          echo "uncompressed per docker image inspect (loaded): $(docker image inspect smart-subtitle-converter-api:smoke --format '{{.Size}}') B" >> "$GITHUB_STEP_SUMMARY"
          cat sizes/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: sizes-${{ steps.arch.outputs.arch }}
          path: sizes/
      - name: Trivy scan (HIGH/CRITICAL fail)
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: smart-subtitle-converter-api:smoke
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # Version tags (v*.*.*): semver, major.minor, sha-<short>, latest + GitHub Release.
  # Pushes to main: edge + sha-<short> only (latest never moves). Never on PRs.
  # GHCR package visibility is UI-only; set public once in package settings if created while the repo was private.
  publish:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: [build-test, docker-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
      - name: Pushed tags
        run: echo "${{ steps.meta.outputs.tags }}" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
      # Packages REST API cannot change visibility (404). One-time UI flip if still private:
      # https://github.com/users/Wauter/packages/container/smart-subtitle-converter-api/settings
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LIBSE=$(grep -oP '(?<=<LibseVersion>)[^<]+' src/SmartSubtitleConverterApi/SmartSubtitleConverterApi.csproj)
          NOTES="Image: \`${IMAGE}:${GITHUB_REF_NAME#v}\` (linux/amd64, linux/arm64). Built on libse ${LIBSE}."
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes "$NOTES"
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes --notes "$NOTES"
          fi
