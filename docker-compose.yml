# Example: docker compose up -d   then   curl -F file=@movie.srt -F target=webvtt localhost:8080/v1/convert -OJ
services:
  subtitleedit-api:
    image: ghcr.io/wauter/subtitleedit-api:latest
    # build: .            # uncomment to build locally instead of pulling
    ports:
      - "8080:8080"
    environment:
      # API_KEYS_FILE: /run/secrets/api_keys   # enable auth (one key per line, optional name:key)
      ERRORS_VERBOSE: "true"                   # set "false" to hide stack traces/internals
      QUEUE_CAPACITY: "32"
      CONVERSION_TIMEOUT_SECONDS: "30"
      MAX_UPLOAD_BYTES: "10485760"
      # METRICS_ENABLED: "true"
      # RATE_LIMIT_PER_MINUTE: "120"
    volumes:
      - ./profiles:/profiles:ro                # your own presets (*.json); see GET /v1/profiles
      # - ./api_keys.txt:/run/secrets/api_keys:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
